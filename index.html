<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘 뭐 사지?</title><meta name="robots" content="noindex">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#22201c;--sub:#7a746b;--pt:#2f6f5e;--line:#e7e1d7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px 60px}h1{font-size:22px;margin:4px 0 6px}.intro{color:var(--sub);margin:0 0 14px}
.notice{font-size:12px;color:var(--sub);background:#efe9df;border-radius:10px;padding:8px 10px;margin:0 0 14px}
.q{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;margin-bottom:14px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.it img,.ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#eee;flex:none}.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.tx b{color:var(--pt);font-size:13px}.tx span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy{flex:none;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:9px 12px;border-radius:999px}
.it.hit{outline:2px solid var(--pt)}.empty{color:var(--sub);text-align:center;padding:30px 0;display:none}
</style></head><body><div class="wrap">
<h1>오늘 뭐 사지?</h1><p class="intro">스레드에서 본 그상품, 번호만 입력하면 바로 찾을 수 있어요.</p>
<p class="notice">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
<input class="q" id="q" type="search" inputmode="search" placeholder="상품 번호나 이름 (예: 23)" autocomplete="off">
<ul id="list">
<li class="it" id="n2" data-q="2 2번 산타장식 사다리타는 벽장식 산타">
  <img src="https://thumbnail.coupangcdn.com/thumbnails/remote/640x640ex/image/vendor_inventory/6751/0a1e9cfedbdd0ea420f45a9534a8cc8a6e94a3ea9f01a06d318b42fe7776.jpg" alt="" loading="lazy" referrerpolicy="no-referrer">
  <div class="tx"><b>2번</b><span>산타장식</span></div>
  <a class="buy" href="https://link.coupang.com/a/iiQcfPklWu" target="_blank" rel="sponsored nofollow noopener">구매하기</a></li>
<li class="it" id="n1" data-q="1 1번 아토베리어 크림 에스트라 아토베리어365 크림 플러스, 90ml, 1개 - 페이셜크림 | 쿠팡">
  <img src="https://thumbnail.coupangcdn.com/thumbnails/remote/640x640ex/image/retail/images/955083884438865-364ff482-1d92-43b5-b230-a8f3aea794d3.jpg" alt="" loading="lazy" referrerpolicy="no-referrer">
  <div class="tx"><b>1번</b><span>아토베리어 크림</span></div>
  <a class="buy" href="https://link.coupang.com/a/iiMNosQ3nU" target="_blank" rel="sponsored nofollow noopener">구매하기</a></li>
</ul><p class="empty" id="empty">찾는 상품이 없어요</p></div>
<script>
const q=document.getElementById('q'),its=[...document.querySelectorAll('.it')],empty=document.getElementById('empty');
function run(){const v=q.value.trim().toLowerCase().replace(/번$/,'');let n=0;its.forEach(li=>{const num=li.id.slice(1);const ok=!v||(/^\d+$/.test(v)?num===v:li.dataset.q.includes(v));li.style.display=ok?'':'none';li.classList.toggle('hit',!!v&&ok);if(ok)n++});empty.style.display=n?'none':'block'}
q.addEventListener('input',run);const h=(location.hash||'').replace('#','')||new URLSearchParams(location.search).get('n')||'';if(h){q.value=h.replace(/^n/,'');run();}
</script></body></html>
